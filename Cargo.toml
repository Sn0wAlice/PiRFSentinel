[package]
name = "pirfsentinel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Passive BLE/WiFi surveillance-equipment scanner for Raspberry Pi (Rust port of RF Sentinel)"

[dependencies]
indicatif = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "signal"] }
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"

[profile.release]
strip = true
